name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Current files and complete reachable Git history secret/publication audit
        run: python scripts/publication_audit.py
      - run: bandit -r prairielearn-course/serverFilesCourse/siip scripts -c pyproject.toml
      - name: Locked dependency vulnerabilities
        run: python -m pip_audit -r requirements-dev.txt
