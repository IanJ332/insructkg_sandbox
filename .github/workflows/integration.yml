name: Local platform integration
on:
  push:
    paths:
      - '.github/workflows/integration.yml'
      - 'tests/e2e/**'
      - 'infrastructure/compose.yaml'
      - 'scripts/**'
      - 'prairielearn-course/**'
      - 'requirements-dev.txt'
  pull_request:
    paths:
      - '.github/workflows/integration.yml'
      - 'tests/e2e/**'
      - 'infrastructure/compose.yaml'
      - 'scripts/**'
      - 'prairielearn-course/**'
      - 'requirements-dev.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prairielearn-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIIP_FEEDBACK_PROVIDER: deterministic
      SIIP_DATA_DIR: ${{ github.workspace }}/artifacts/public-data
      SIIP_ENV: development
      SIIP_ALLOW_SYNTHETIC_AUTH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/manage.py install
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Initialize clearly synthetic graph/corpus in disposable runner
        run: |
          .venv/bin/python scripts/init_public.py
          .venv/bin/python scripts/init_public.py prairielearn-course/serverFilesCourse/siip/data
      - name: Install video packaging tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Full instructor-to-student browser lifecycle with persisted graph grounding
        env:
          SIIP_RUN_FULL_BROWSER: "1"
        run: .venv/bin/python -m unittest discover -s tests/e2e -p test_full_sandbox_browser.py -v
      - run: .venv/bin/python scripts/seed.py
      - run: .venv/bin/python scripts/manage.py start
      - run: .venv/bin/python scripts/smoke.py
      - name: Actual PL submission, feedback, retry, CSV persistence and analytics
        run: .venv/bin/python tests/e2e/prairielearn_flow.py --ack-local-synthetic
      - name: Phase 5 Playwright Browser End-to-End Test Suites
        run: |
          .venv/bin/python -m unittest tests/e2e/test_browser_demos.py tests/e2e/test_em_lifecycle_browser.py tests/e2e/test_async_browser_flow.py tests/e2e/test_real_browser_e2e.py -v
      - name: Restart both services and verify persistence
        run: |
          .venv/bin/python scripts/persistence_probe.py before
          .venv/bin/python scripts/manage.py stop
          .venv/bin/python scripts/manage.py start
          .venv/bin/python scripts/smoke.py
          .venv/bin/python scripts/persistence_probe.py after
      - if: always()
        run: .venv/bin/python scripts/manage.py stop
