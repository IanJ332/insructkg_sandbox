name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      SIIP_DATA_DIR: ${{ github.workspace }}/artifacts/public-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/init_public.py
      - run: python scripts/validate_config.py
      - run: python -m pip check
      - run: ruff check . && ruff format --check . && mypy
      - name: Deterministic, HTTP/provider contract, storage and integration tests (synthetic data)
        run: python -m unittest discover -s tests -v
      - name: Build code-only distribution and inspect inventory
        run: python -m pip wheel --no-deps . --wheel-dir artifacts/dist && python scripts/check_wheel.py
