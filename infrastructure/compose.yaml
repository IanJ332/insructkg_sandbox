name: siip-sandbox
services:
  prairielearn:
    image: prairielearn/prairielearn@sha256:f030faf735fdbb80c0307cc1b599d0757bb76a2f4573fbab9a7303adad4275ac
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../prairielearn-course:/course:ro
      - pl-postgres-data:/var/postgres
    environment:
      SIIP_FEEDBACK_PROVIDER: ${SIIP_FEEDBACK_PROVIDER:-deterministic}
      SIIP_LLM_BASE_URL: ${SIIP_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      SIIP_LLM_MODEL: ${SIIP_LLM_MODEL:-local-model}
    restart: "no"
volumes:
  pl-postgres-data:
